<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexSec App</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0E1F3D;--navy2:#162B52;--teal:#0B7A63;--teal2:#0D9478;
  --gold:#C8A96E;--gold2:#E2C68A;--cream:#F7F3EE;--warm:#EDE8E0;
  --text:#1A1A2E;--muted:#6B6B7A;--white:#fff;--line:rgba(200,169,110,.2);
  --sidebar:240px;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;min-height:100vh;color:var(--text)}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--navy);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:50;
  border-right:1px solid var(--line);
}
.sb-brand{
  padding:1.5rem 1.25rem;border-bottom:1px solid var(--line);
  font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;
  color:var(--gold);letter-spacing:.04em;
}
.sb-brand span{color:rgba(255,255,255,.45);font-size:.8rem;font-weight:400}
nav{flex:1;padding:.75rem 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.65rem 1.25rem;cursor:pointer;
  font-size:.83rem;color:rgba(255,255,255,.55);
  transition:background .15s,color .15s;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(11,122,99,.15);color:var(--white);border-left-color:var(--teal)}
.nav-icon{width:16px;text-align:center;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.nav-section{
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;
  color:rgba(255,255,255,.25);text-transform:uppercase;
  padding:.5rem 1.25rem .25rem;margin-top:.5rem;
}
.sb-upgrade{margin:0 .75rem .75rem;border:1px solid var(--line);padding:1rem;background:rgba(200,169,110,.06)}
.sb-upgrade p{font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:.6rem;line-height:1.5}
.sb-upgrade button{
  width:100%;padding:.5rem;background:var(--gold);color:var(--navy);
  font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  border:none;cursor:pointer;font-family:'DM Sans',sans-serif;
}
.sb-user{
  padding:1rem 1.25rem;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:.75rem;
}
.sb-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--teal);
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:500;color:var(--white);flex-shrink:0;
}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-size:.8rem;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:.7rem;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace}
.sb-logout{
  font-size:.7rem;color:rgba(255,255,255,.3);cursor:pointer;background:none;border:none;
  text-transform:uppercase;letter-spacing:.05em;font-family:'DM Mono',monospace;
  padding:.25rem 0;display:block;transition:color .2s;
}
.sb-logout:hover{color:rgba(255,255,255,.6)}

/* ── MAIN ── */
#main{margin-left:var(--sidebar);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  background:var(--white);border-bottom:1px solid rgba(14,31,61,.1);
  padding:.9rem 2rem;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:40;
}
.topbar-title{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--navy)}
.topbar-org{font-size:.78rem;color:var(--muted)}
.content{padding:2.5rem 2rem;flex:1}

/* ── CARDS ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2.5rem}
.stat-card{
  background:var(--white);border:1px solid rgba(14,31,61,.08);padding:1.5rem;
  transition:border-color .2s,transform .2s;
}
.stat-card:hover{border-color:var(--teal);transform:translateY(-2px)}
.stat-num{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--navy);line-height:1}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.stat-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .5rem;background:rgba(11,122,99,.1);color:var(--teal);margin-top:.4rem}
.card{background:var(--white);border:1px solid rgba(14,31,61,.08);margin-bottom:1.5rem}
.card-header{
  padding:1.25rem 1.5rem;border-bottom:1px solid rgba(14,31,61,.07);
  display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--navy)}
.card-body{padding:1.5rem}
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.55rem 1.1rem;font-size:.78rem;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
  font-family:'DM Sans',sans-serif;border:none;transition:background .2s,color .2s;
}
.btn-primary{background:var(--teal);color:var(--white)}
.btn-primary:hover{background:var(--teal2)}
.btn-outline{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn-outline:hover{background:var(--teal);color:var(--white)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold2)}
.btn-sm{padding:.38rem .75rem;font-size:.72rem}
.btn-danger{background:rgba(180,30,30,.08);color:#a02020;border:1px solid rgba(180,30,30,.2)}
.btn-danger:hover{background:rgba(180,30,30,.15)}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;padding:.6rem 1rem;font-size:.68rem;font-family:'DM Mono',monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid rgba(14,31,61,.1)}
td{padding:.75rem 1rem;border-bottom:1px solid rgba(14,31,61,.06);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(11,122,99,.03)}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .55rem;letter-spacing:.06em}
.badge-owner{background:rgba(200,169,110,.15);color:#8a6820}
.badge-admin{background:rgba(11,122,99,.12);color:var(--teal)}
.badge-member{background:rgba(14,31,61,.08);color:var(--muted)}
.badge-free{background:rgba(14,31,61,.08);color:var(--muted)}
.badge-pro{background:rgba(11,122,99,.12);color:var(--teal)}
.badge-active{background:rgba(11,122,99,.12);color:var(--teal)}
.badge-past_due{background:rgba(180,30,30,.1);color:#a02020}
.badge-canceled{background:rgba(14,31,61,.08);color:var(--muted)}

/* ── PLAN CARDS ── */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.plan-card{border:1px solid rgba(14,31,61,.12);padding:1.75rem;position:relative;transition:border-color .2s}
.plan-card.current{border-color:var(--teal)}
.plan-card .plan-badge{position:absolute;top:-.55rem;left:1rem;background:var(--teal);color:var(--white);font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;padding:.2rem .6rem;text-transform:uppercase}
.plan-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.25rem}
.plan-price{font-size:1.75rem;font-weight:700;color:var(--navy);margin-bottom:1rem}
.plan-price span{font-size:.85rem;font-weight:400;color:var(--muted)}
.plan-features{list-style:none;margin-bottom:1.5rem}
.plan-features li{font-size:.82rem;color:var(--muted);padding:.3rem 0;display:flex;align-items:center;gap:.5rem}
.plan-features li::before{content:'✓';color:var(--teal);font-weight:700;flex-shrink:0}

/* ── SCORE ── */
.score-wrap{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;margin-bottom:2rem;align-items:start}
.score-dial{background:var(--white);border:1px solid rgba(14,31,61,.08);padding:2rem;text-align:center}
.score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid var(--cream);position:relative}
.score-num{font-family:'Playfair Display',serif;font-size:3rem;font-weight:700;line-height:1}
.score-grade{font-family:'DM Mono',monospace;font-size:.85rem;letter-spacing:.1em;margin-top:.2rem}
.score-label{font-size:.78rem;color:var(--muted);margin-top:.5rem}
.score-updated{font-family:'DM Mono',monospace;font-size:.62rem;color:rgba(14,31,61,.3);margin-top:.25rem}
.score-bars{background:var(--white);border:1px solid rgba(14,31,61,.08);padding:1.5rem}
.score-bar-row{margin-bottom:1.25rem}
.score-bar-row:last-child{margin-bottom:0}
.score-bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.score-bar-name{font-size:.82rem;font-weight:500;color:var(--text)}
.score-bar-meta{font-size:.72rem;color:var(--muted)}
.score-bar-track{height:8px;background:rgba(14,31,61,.07);border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.score-bar-label{font-size:.72rem;color:var(--muted);margin-top:.3rem}
.score-a-plus{border-color:#0B7A63;color:#0B7A63}
.score-a    {border-color:#0B7A63;color:#0B7A63}
.score-b    {border-color:#4a9e6b;color:#4a9e6b}
.score-c    {border-color:#C8A96E;color:#8a6820}
.score-d    {border-color:#e08030;color:#c06020}
.score-f    {border-color:#a02020;color:#a02020}

/* ── EMPTY + COMING SOON ── */
.empty{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:1rem;opacity:.3}
.empty h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--navy);margin-bottom:.5rem}
.empty p{font-size:.85rem;line-height:1.7}
.coming-soon{
  background:var(--warm);border:1.5px dashed rgba(14,31,61,.15);
  padding:3.5rem 2rem;text-align:center;
}
.coming-soon h3{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--navy);margin-bottom:.5rem}
.coming-soon p{font-size:.84rem;color:var(--muted);max-width:380px;margin:0 auto;line-height:1.7}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(14,31,61,.5);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--white);width:100%;max-width:460px;padding:2rem}
.modal h3{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--navy);margin-bottom:1.5rem}
.modal label{display:block;font-size:.78rem;font-weight:500;color:var(--text);margin-bottom:.35rem}
.modal input,.modal select{display:block;width:100%;padding:.7rem 1rem;border:1px solid rgba(14,31,61,.2);font-family:'DM Sans',sans-serif;font-size:.88rem;color:var(--text);outline:none;margin-bottom:1rem;background:var(--white)}
.modal input:focus,.modal select:focus{border-color:var(--teal)}
.modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:.5rem}
.error-msg{background:rgba(180,30,30,.07);border:1px solid rgba(180,30,30,.2);color:#a02020;font-size:.8rem;padding:.6rem .9rem;margin-bottom:1rem;display:none}
.error-msg.show{display:block}
.success-msg{background:rgba(11,122,99,.08);border:1px solid rgba(11,122,99,.25);color:var(--teal);font-size:.8rem;padding:.6rem .9rem;margin-bottom:1rem;display:none}
.success-msg.show{display:block}

/* ── LOADING ── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(14,31,61,.15);border-top-color:var(--teal);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loading{display:flex;align-items:center;justify-content:center;min-height:300px}

@media(max-width:900px){
  #sidebar{width:60px}.sb-brand,.nav-item span,.nav-section,.sb-upgrade,.sb-user-info,.sb-logout{display:none}
  .nav-item{justify-content:center;padding:.75rem}
  #main{margin-left:60px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .plan-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-brand">LEXSEC<br><span>Advisory Platform</span></div>
  <nav>
    <div class="nav-section">Platform</div>
    <div class="nav-item active" onclick="nav('dashboard')"><span class="nav-icon">⬡</span><span>Dashboard</span></div>
    <div class="nav-section">GRC</div>
    <div class="nav-item" onclick="nav('evidence')"><span class="nav-icon">📋</span><span>Evidence</span></div>
    <div class="nav-item" onclick="nav('risks')"><span class="nav-icon">⚠</span><span>Risk Register</span></div>
    <div class="nav-item" onclick="nav('vendors')"><span class="nav-icon">🔗</span><span>Vendors</span></div>
    <div class="nav-item" onclick="nav('calendar')"><span class="nav-icon">📅</span><span>Calendar</span></div>
    <div class="nav-item" onclick="nav('audit')"><span class="nav-icon">📝</span><span>Audit Log</span></div>
    <div class="nav-section">Organization</div>
    <div class="nav-item" onclick="nav('team')"><span class="nav-icon">👥</span><span>Team</span></div>
    <div class="nav-item" onclick="nav('billing')"><span class="nav-icon">💳</span><span>Billing</span></div>
    <div class="nav-item" onclick="nav('settings')"><span class="nav-icon">⚙</span><span>Settings</span></div>
  </nav>
  <div class="sb-upgrade" id="sb-upgrade" style="display:none">
    <p>Upgrade to Pro to unlock full GRC suite.</p>
    <button onclick="upgradePro()">Upgrade — $299/mo</button>
  </div>
  <div class="sb-user">
    <div class="sb-avatar" id="user-avatar">?</div>
    <div class="sb-user-info">
      <div class="sb-user-name" id="user-name">Loading…</div>
      <div class="sb-user-role" id="user-role"></div>
    </div>
  </div>
  <button class="sb-logout" onclick="logout()">Sign out</button>
</aside>

<div id="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-org" id="topbar-org"></div>
    </div>
    <div id="topbar-actions"></div>
  </div>
  <div class="content" id="content">
    <div class="page-loading"><div class="spinner"></div></div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const S = { user: null, orgs: [], currentOrg: null, currentSection: 'dashboard' }

// ── API ────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts })
  if (res.status === 401) { location.href = '/login.html'; throw new Error('unauth') }
  return res
}
const get  = path => api(path)
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) })
const put  = (path, body) => api(path, { method: 'PUT',  body: JSON.stringify(body) })
const del  = (path) => api(path, { method: 'DELETE' })

// ── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res  = await get('/api/auth/me')
    const data = await res.json()
    S.user = data.user
    S.orgs = data.orgs || []
    S.currentOrg = S.orgs[0] || null

    document.getElementById('user-name').textContent = S.user.full_name
    document.getElementById('user-avatar').textContent = S.user.full_name.charAt(0).toUpperCase()
    document.getElementById('user-role').textContent = S.currentOrg?.role || ''
    document.getElementById('topbar-org').textContent = S.currentOrg?.name || ''

    if (S.currentOrg?.plan === 'free') document.getElementById('sb-upgrade').style.display = ''

    const hash = (location.hash.slice(1) || 'dashboard').split('?')[0]
    await nav(hash)
  } catch(e) {
    if (e.message !== 'unauth') console.error(e)
  }
}

// ── ROUTING ────────────────────────────────────────────────────────────────
const TITLES = { dashboard:'Dashboard', evidence:'Evidence', risks:'Risk Register', vendors:'Vendors', calendar:'Compliance Calendar', audit:'Audit Log', team:'Team', billing:'Billing', settings:'Settings' }

async function nav(section) {
  S.currentSection = section
  location.hash = section
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick')?.includes(`'${section}'`)) el.classList.add('active')
  })
  document.getElementById('page-title').textContent = TITLES[section] || section
  document.getElementById('topbar-actions').innerHTML = ''
  setContent('<div class="page-loading"><div class="spinner"></div></div>')
  await SECTIONS[section]?.()
}

function setContent(html) { document.getElementById('content').innerHTML = html }
function setActions(html)  { document.getElementById('topbar-actions').innerHTML = html }

// ── SECTIONS ───────────────────────────────────────────────────────────────
const SECTIONS = {

  // DASHBOARD
  async dashboard() {
    const org  = S.currentOrg
    const plan = org?.plan || 'free'

    // Load score + counts in parallel
    const [scoreRes, evRes, riskRes, vendorRes] = await Promise.all([
      get('/api/score'),
      get('/api/evidence'),
      get('/api/risks'),
      get('/api/vendors'),
    ])
    const sc      = scoreRes.ok  ? await scoreRes.json()  : null
    const ev      = evRes.ok     ? await evRes.json()     : {}
    const risks   = riskRes.ok   ? await riskRes.json()   : []
    const vendors = vendorRes.ok ? await vendorRes.json() : []

    const evCount    = Object.values(ev).reduce((s, a) => s + a.length, 0)
    const openRisks  = risks.filter(r => r.status === 'open' || !r.status).length
    const hiVendors  = vendors.filter(v => v.riskLevel === 'high' || v.riskLevel === 'critical').length

    const barColor = s => s >= 80 ? '#0B7A63' : s >= 60 ? '#C8A96E' : '#a02020'
    const gradeClass = g => ({ 'A+':'a-plus', A:'a', B:'b', C:'c', D:'d', F:'f' })[g] || 'f'

    const scoreHtml = sc ? `
      <div class="score-wrap">
        <div class="score-dial">
          <div class="score-circle score-${gradeClass(sc.grade)}">
            <div class="score-num">${sc.overall}</div>
            <div class="score-grade">${sc.grade}</div>
          </div>
          <div style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.25rem">Audit Readiness Score</div>
          <div class="score-label">Based on evidence freshness,<br>open risks, vendors &amp; calendar</div>
          <div class="score-updated">Updated just now</div>
        </div>
        <div class="score-bars">
          <div style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:1.25rem">Score Breakdown</div>
          ${Object.entries(sc.components).map(([key, comp]) => `
          <div class="score-bar-row">
            <div class="score-bar-header">
              <span class="score-bar-name">${key.charAt(0).toUpperCase()+key.slice(1)} <span style="font-size:.7rem;color:var(--muted);font-weight:400">(${comp.weight}%)</span></span>
              <span class="score-bar-meta">${comp.score}/100</span>
            </div>
            <div class="score-bar-track">
              <div class="score-bar-fill" style="width:${comp.score}%;background:${barColor(comp.score)}"></div>
            </div>
            <div class="score-bar-label">${comp.label}</div>
          </div>`).join('')}
        </div>
      </div>` : ''

    setContent(`
      ${scoreHtml}
      <div class="stat-row">
        <div class="stat-card" onclick="nav('evidence')" style="cursor:pointer">
          <div class="stat-num">${evCount}</div>
          <div class="stat-label">Evidence Files</div>
          <div class="stat-badge">Click to manage</div>
        </div>
        <div class="stat-card" onclick="nav('risks')" style="cursor:pointer">
          <div class="stat-num">${openRisks}</div>
          <div class="stat-label">Open Risks</div>
          <div class="stat-badge" style="${openRisks > 0 ? 'background:rgba(180,30,30,.1);color:#a02020' : ''}">
            ${openRisks > 0 ? 'Needs attention' : 'All clear'}
          </div>
        </div>
        <div class="stat-card" onclick="nav('vendors')" style="cursor:pointer">
          <div class="stat-num">${vendors.length}</div>
          <div class="stat-label">Vendors Tracked</div>
          <div class="stat-badge" style="${hiVendors > 0 ? 'background:rgba(180,30,30,.1);color:#a02020' : ''}">
            ${hiVendors > 0 ? hiVendors + ' high risk' : 'Risk levels OK'}
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-num">${S.orgs.length}</div>
          <div class="stat-label">Organization${S.orgs.length !== 1 ? 's' : ''}</div>
          <div class="stat-badge">${org?.name || '—'}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Organization</div></div>
        <div class="card-body">
          <table>
            <tr><td style="color:var(--muted);width:140px">Name</td><td><strong>${org?.name || '—'}</strong></td></tr>
            <tr><td style="color:var(--muted)">Plan</td><td><span class="badge badge-${plan}">${plan.charAt(0).toUpperCase()+plan.slice(1)}</span></td></tr>

              : (sub.plan||'free') === key && key !== 'free'
                ? `<button class="btn btn-outline" style="width:100%" onclick="openPortal()">Manage</button>`
                : key === 'free' ? `<button class="btn" style="width:100%;background:var(--warm);color:var(--muted);cursor:default">Current</button>` : ''}
          </div>`).join('')}
      </div>
    `)
  },

  // SETTINGS
  async settings() {
    setContent(`<div class="coming-soon"><h3>Organization Settings</h3><p>Manage your organization's name, branding, SSO configuration, and API keys. Coming soon.</p></div>`)
  },
}

// ── EVIDENCE ACTIONS ──────────────────────────────────────────────────────
let _pendingFile = null

function uploadEvidence(input) {
  const file = input.files[0]
  if (!file) return
  _pendingFile = file
  document.getElementById('ev-modal').style.display = 'flex'
  input.value = ''
}

function cancelUpload() {
  _pendingFile = null
  closeModal()
}

async function confirmUpload() {
  if (!_pendingFile) return
  const btn  = document.getElementById('ev-submit')
  const errEl = document.getElementById('ev-err')
  const fw   = document.getElementById('ev-fw').value.trim()
  const ctrl = document.getElementById('ev-ctrl').value.trim()
  if (!fw || !ctrl) { errEl.textContent = 'Framework and control key are required'; errEl.classList.add('show'); return }
  btn.disabled = true; btn.textContent = 'Uploading…'

  const reader = new FileReader()
  reader.onload = async e => {
    const res = await post('/api/evidence', {
      fwId:           fw,
      ctrlKey:        ctrl,
      name:           _pendingFile.name,
      mimeType:       _pendingFile.type,
      dataUrl:        e.target.result,
      owner:          document.getElementById('ev-owner').value.trim(),
      collectionDate: document.getElementById('ev-date').value,
    })
    const data = await res.json()
    if (!res.ok) { errEl.textContent = data.error || 'Upload failed'; errEl.classList.add('show'); btn.disabled = false; btn.textContent = 'Upload'; return }
    _pendingFile = null
    closeModal()
    await SECTIONS.evidence()
  }
  reader.readAsDataURL(_pendingFile)
}

async function deleteEvidence(id) {
  if (!confirm('Delete this evidence file?')) return
  await del(`/api/evidence/${id}`)
  await SECTIONS.evidence()
}

function openInviteModal() { document.getElementById('invite-modal').style.display = 'flex' }

async function sendInvite() {
  const email = document.getElementById('inv-email').value
  const role  = document.getElementById('inv-role').value
  const errEl = document.getElementById('invite-err')
  const okEl  = document.getElementById('invite-ok')
  errEl.classList.remove('show'); okEl.classList.remove('show')

  const res  = await post(`/api/orgs/${S.currentOrg.id}/invite`, { email, role })
  const data = await res.json()
  if (!res.ok) { errEl.textContent = data.error || 'Failed to send invite'; errEl.classList.add('show'); return }

  okEl.textContent = `Invitation sent to ${email}`; okEl.classList.add('show')
  document.getElementById('inv-email').value = ''
  setTimeout(closeModal, 1500)
}

  if (!confirm(`Remove ${name} from this organization?`)) return
  const res = await del(`/api/orgs/${S.currentOrg.id}/members/${userId}`)
  if (res.ok) await SECTIONS.team()
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—'
}
function fmtBytes(n) {
  if (!n) return '0 B'
  const u = ['B','KB','MB','GB']
  let i = 0; while (n >= 1024 && i < u.length-1) { n /= 1024; i++ }
  return `${n.toFixed(i?1:0)} ${u[i]}`
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function escJs(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")
}
