# ──────────────────────────────────────────────────────────────────────────────
# Accave Verilink GRC Platform — Nginx reverse-proxy config
#
# Place at: /etc/nginx/conf.d/grc-platform.conf
# After Certbot runs it will add the SSL server block automatically.
#
# Replace YOUR_DOMAIN with your actual domain before copying.
# ──────────────────────────────────────────────────────────────────────────────

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Main HTTPS block (Certbot will populate ssl_certificate lines)
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ssl_certificate      /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key  /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include              /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;

    # Upload size limit — evidence files up to 50 MB
    client_max_body_size 60M;

    # Proxy to Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  'upgrade';
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # Static assets — let Nginx serve them directly (faster, no Node overhead)
    location /public/ {
        alias /opt/grc-platform/public/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
