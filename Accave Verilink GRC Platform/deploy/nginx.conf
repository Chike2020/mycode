# ──────────────────────────────────────────────────────────────────────────────
# Multi-site Nginx config — all 4 domains on one EC2 instance
# Place at: /etc/nginx/conf.d/multisite.conf
#
# Placeholders replaced by setup.sh:
#   DOMAIN_LEXSEC   → lexsecadvisory.com
#   DOMAIN_ACCAVE   → accaveverilink.com
#   DOMAIN_SHEPHERD → shepherdgrc.com
#   DOMAIN_PRIMUM   → primumgrc.com
# ──────────────────────────────────────────────────────────────────────────────

# ── Shared proxy settings (included by each HTTPS block) ─────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 1. LexSec Advisory — static site
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen 80;
    server_name DOMAIN_LEXSEC www.DOMAIN_LEXSEC;
    return 301 https://DOMAIN_LEXSEC$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN_LEXSEC www.DOMAIN_LEXSEC;

    # Certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN_LEXSEC/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN_LEXSEC/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;

    root  /var/www/lexsec;
    index index.html;

    # Clean URLs — try file, then directory, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML pages themselves
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 2. Accave Verilink GRC Platform — Node.js :3000
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen 80;
    server_name DOMAIN_ACCAVE www.DOMAIN_ACCAVE;
    return 301 https://DOMAIN_ACCAVE$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN_ACCAVE www.DOMAIN_ACCAVE;

    # ssl_certificate     /etc/letsencrypt/live/DOMAIN_ACCAVE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN_ACCAVE/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           strict-origin-when-cross-origin       always;

    client_max_body_size 60M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  $connection_upgrade;
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}

