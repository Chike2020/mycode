<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRC Platform — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f11;--bg2:#161719;--bg3:#1e1f22;--bg4:#26272b;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);--text:#f0f0f0;--text2:#9a9ba0;--text3:#555662;--accent:#6c8fff;--accent-bg:rgba(108,143,255,0.1);--green:#4ade80;--red:#f87171;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.logo{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}.logo span{color:var(--accent)}
.tagline{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:28px}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:500;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.on{color:var(--accent);border-color:var(--accent)}
.form{display:flex;flex-direction:column;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-family:'DM Mono',monospace}
.form-group input{padding:9px 12px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .12s}
.form-group input:focus{border-color:var(--accent)}
.btn-primary{padding:10px;font-size:13px;font-weight:600;border:none;border-radius:var(--r);background:var(--accent);color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .12s;margin-top:4px}
.btn-primary:hover{opacity:.9}.btn-primary:disabled{opacity:.5;cursor:default}
.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--red);display:none}
.ok-msg{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--green);display:none}
.divider{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:11px;margin:4px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.invite-notice{background:var(--accent-bg);border:1px solid rgba(108,143,255,.2);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:8px;display:none}
.invite-notice strong{color:var(--text)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;font-size:11px;color:var(--text3);margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">GRC <span>Platform</span></div>
  <div class="tagline">AI-powered compliance · multiuser · v13 SaaS</div>

  <div id="invite-notice" class="invite-notice"></div>
  <div id="err" class="err"></div>
  <div id="ok-msg" class="ok-msg"></div>

  <div class="tabs">
    <div class="tab on" id="tab-login" onclick="showTab('login')">Sign in</div>
    <div class="tab" id="tab-register" onclick="showTab('register')">Create account</div>
  </div>

  <!-- Login form -->
  <div id="form-login" class="form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">Sign in</button>
  </div>

  <!-- Register form -->
  <div id="form-register" class="form" style="display:none">
    <div class="form-group">
      <label>Your name</label>
      <input type="text" id="r-name" placeholder="Jane Smith">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="r-email" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="r-password" placeholder="Min. 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group" id="org-field">
      <label>Organisation name</label>
      <input type="text" id="r-org" placeholder="Acme Corp" value="">
    </div>
    <button class="btn-primary" id="btn-register" onclick="doRegister()">Create account</button>
  </div>

  <div class="footer">GRC Platform · 11 frameworks · AI-powered</div>
</div>

<script>
let _inviteToken = null;
let _inviteData  = null;

function showTab(tab) {
  document.getElementById('form-login').style.display    = tab === 'login'    ? 'flex' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
  document.getElementById('tab-login').classList.toggle('on', tab === 'login');
  document.getElementById('tab-register').classList.toggle('on', tab === 'register');
  hideMessages();
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('ok-msg').style.display = 'none';
}

function showOk(msg) {
  const el = document.getElementById('ok-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('err').style.display = 'none';
}

function hideMessages() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('ok-msg').style.display = 'none';
}

async function doLogin() {
  const btn   = document.getElementById('btn-login');
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-password').value;
  if (!email || !pass) return showErr('Please enter your email and password.');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Signing in…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass }),
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error || 'Login failed'); return; }
    window.location.href = '/app';
  } catch { showErr('Network error — please try again.'); }
  finally { btn.disabled = false; btn.innerHTML = 'Sign in'; }
}

async function doRegister() {
  const btn   = document.getElementById('btn-register');
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-password').value;
  const org   = document.getElementById('r-org').value.trim();
  if (!name || !email || !pass) return showErr('Please fill in all required fields.');
  if (pass.length < 8) return showErr('Password must be at least 8 characters.');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Creating account…';
  try {
    const body = { name, email, password: pass, orgName: org || undefined };
    if (_inviteToken) body.inviteToken = _inviteToken;
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error || 'Registration failed'); return; }
    window.location.href = '/app';
  } catch { showErr('Network error — please try again.'); }
  finally { btn.disabled = false; btn.innerHTML = 'Create account'; }
}

// Check for invite token in URL
(async function init() {
  const params = new URLSearchParams(window.location.search);
  const invite = params.get('invite');
  if (invite) {
    _inviteToken = invite;
    try {
      const r = await fetch(`/api/org/invite/${invite}`);
      if (r.ok) {
        _inviteData = await r.json();
        const n = document.getElementById('invite-notice');
        n.innerHTML = `You've been invited to join <strong>${_inviteData.orgName}</strong> as <strong>${_inviteData.role}</strong>.`;
        n.style.display = 'block';
        document.getElementById('r-email').value = _inviteData.email || '';
        document.getElementById('org-field').style.display = 'none';
        showTab('register');
      }
    } catch {}
  }

  // If already logged in, go to app
  try {
    const r = await fetch('/api/auth/me');
    if (r.ok) window.location.href = '/app';
  } catch {}
})();
</script>
</body>
</html>
